<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐠 App Aquário</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: linear-gradient(135deg, #0c4a6e, #1a8a9c); min-height: 100vh; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; padding: 20px; font-size: 1.8rem; }
        
        .abas { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 20px; }
        .aba { flex: 1; min-width: 120px; padding: 12px; border: none; border-radius: 10px 10px 0 0; 
               background: rgba(255,255,255,0.2); color: #fff; cursor: pointer; font-size: 1rem; }
        .aba.ativa { background: #fff; color: #0c4a6e; font-weight: bold; }
        
        .conteudo { background: rgba(255,255,255,0.95); color: #333; padding: 25px; 
                    border-radius: 0 0 15px 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .aba-conteudo { display: none; }
        .aba-conteudo.ativa { display: block; }
        
        input, button, select { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #ddd; 
                                 border-radius: 8px; font-size: 1rem; }
        button { background: #0c4a6e; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #1a8a9c; }
        .resultado { margin-top: 15px; padding: 15px; background: #e8f4f8; border-radius: 8px; font-weight: bold; }
        .aviso { color: #d35400; margin-top: 10px; }
        .ok { color: #27ae60; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐠 App Aquário</h1>

        <div class="abas">
            <button class="aba ativa" data-aba="calc">📐 Calculadora</button>
            <button class="aba" data-aba="param">💧 Parâmetros</button>
            <button class="aba" data-aba="peixes">🐟 Habitantes</button>
            <button class="aba" data-aba="luz">☀️ Luz & Algas</button>
        </div>

        <div class="conteudo">
            <!-- ABA 1: CALCULADORA -->
            <div class="aba-conteudo ativa" id="calc">
                <h3>📐 Volume do Aquário</h3>
                <label>Comprimento (cm):</label>
                <input type="number" id="comp" placeholder="Ex: 80">
                <label>Largura (cm):</label>
                <input type="number" id="larg" placeholder="Ex: 40">
                <label>Altura da Água (cm):</label>
                <input type="number" id="alt" placeholder="Ex: 40">
                <button onclick="calcular()">Calcular Volume</button>
                <div class="resultado" id="res-calc"></div>
            </div>

            <!-- ABA 2: PARÂMETROS -->
            <div class="aba-conteudo" id="param">
                <h3>💧 Verificar Parâmetros</h3>
                <label>pH:</label>
                <input type="number" step="0.1" id="ph" placeholder="Ex: 6.8">
                <label>Temperatura (°C):</label>
                <input type="number" step="0.1" id="temp" placeholder="Ex: 26">
                <label>GH (Dureza Geral):</label>
                <input type="number" id="gh" placeholder="Ex: 6">
                <button onclick="verificarParam()">Analisar</button>
                <div class="resultado" id="res-param"></div>
            </div>

            <!-- ABA 3: HABITANTES -->
            <div class="aba-conteudo" id="peixes">
                <h3>🐟 Quantos peixes cabem?</h3>
                <label>Volume total (litros):</label>
                <input type="number" id="vol" placeholder="Resultado da aba 1">
                <label>Tipo de peixe:</label>
                <select id="tipo-peixe">
                    <option value="0.5">Peixes pequenos (Neon, Tetra)</option>
                    <option value="1">Peixes médios (Coridora, Betta)</option>
                    <option value="3">Peixes grandes (Oscar, Acará)</option>
                </select>
                <button onclick="calcularPeixes()">Calcular</button>
                <div class="resultado" id="res-peixes"></div>
            </div>

            <!-- ABA 4: LUZ & ALGAS -->
            <div class="aba-conteudo" id="luz">
                <h3>☀️ Luz & Algas</h3>
                <label>Quantas horas de luz por dia?</label>
                <input type="number" id="horas-luz" placeholder="Ex: 8">
                <label>Tem algas visíveis?</label>
                <select id="tem-algas">
                    <option value="nao">Não</option>
                    <option value="pouco">Pouco</option>
                    <option value="muito">Muito</option>
                </select>
                <button onclick="verificarLuz()">Analisar</button>
                <div class="resultado" id="res-luz"></div>
            </div>
        </div>
    </div>

    <script>
        // ✅ LINK JÁ CONFIGURADO!
        const API = "https://app-aquario-2.onrender.com";

        // Navegação entre abas
        document.querySelectorAll('.aba').forEach(botao => {
            botao.addEventListener('click', () => {
                document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
                document.querySelectorAll('.aba-conteudo').forEach(c => c.classList.remove('ativa'));
                botao.classList.add('ativa');
                document.getElementById(botao.dataset.aba).classList.add('ativa');
            });
        });

        // Calculadora de volume
        function calcular() {
            const c = Number(document.getElementById('comp').value);
            const l = Number(document.getElementById('larg').value);
            const a = Number(document.getElementById('alt').value);
            if (!c || !l || !a) {
                document.getElementById('res-calc').innerHTML = '<span class="aviso">Preencha todos os campos!</span>';
                return;
            }
            const litros = (c * l * a) / 1000;
            document.getElementById('res-calc').innerHTML = 
                `✅ Volume: ${litros.toFixed(1)} litros`;
        }

        // Verificar parâmetros
        function verificarParam() {
            const ph = Number(document.getElementById('ph').value);
            const temp = Number(document.getElementById('temp').value);
            const gh = Number(document.getElementById('gh').value);
            let resp = '';

            if (ph >= 6.0 && ph <= 7.5) resp += '✅ pH ideal<br>';
            else resp += `<span class="aviso">⚠️ pH ${ph} — ideal: 6.0 a 7.5</span><br>`;

            if (temp >= 24 && temp <= 28) resp += '✅ Temperatura ideal<br>';
            else resp += `<span class="aviso">⚠️ Temp ${temp}°C — ideal: 24 a 28°C</span><br>`;

            if (gh >= 4 && gh <= 12) resp += '✅ Dureza ideal';
            else resp += `<span class="aviso">⚠️ GH ${gh} — ideal: 4 a 12</span>`;

            document.getElementById('res-param').innerHTML = resp;
        }

        // Calcular quantidade de peixes
        function calcularPeixes() {
            const vol = Number(document.getElementById('vol').value);
            const espaco = Number(document.getElementById('tipo-peixe').value);
            if (!vol) {
                document.getElementById('res-peixes').innerHTML = 
                    '<span class="aviso">Coloque o volume da aba 1!</span>';
                return;
            }
            const qtd = Math.floor(vol / espaco / 2); // margem de segurança
            document.getElementById('res-peixes').innerHTML = 
                `✅ Cabem aproximadamente ${qtd} peixes (com folga)`;
        }

        // Luz e algas
        function verificarLuz() {
            const horas = Number(document.getElementById('horas-luz').value);
            const algas = document.getElementById('tem-algas').value;
            let resp = '';

            if (horas >= 6 && horas <= 9) resp += '✅ Tempo de luz ideal<br>';
            else resp += `<span class="aviso">⚠️ ${horas}h — ideal: 6 a 9h</span><br>`;

            if (algas === 'muito') resp += 
                '<span class="aviso">🔴 Reduza a luz! Faça trocas parciais de água</span>';
            else if (algas === 'pouco') resp += 
                '<span class="aviso">🟡 Fique de olho — pode aumentar</span>';
            else resp += '✅ Sem sinais de alga';

            document.getElementById('res-luz').innerHTML = resp;
        }
    </script>
</body>
</html>
